# Instrument universe for the ML-vs-rule-based trend-following study (qresearch.tfml).
#
# Every instrument carries: market (the paper's "market" dimension), asset_class,
# exchange/region (venue dimension), source (where the bars come from), and a
# per-side transaction-cost assumption in bps of traded notional (cost_bps) plus
# slippage_bps. Costs are charged on |position change| at execution.
#
# survivorship flag: "none" = index/ETF/FX/futures series that do not depend on
# a constituent list chosen today; "current_constituents" = single stocks picked
# from TODAY's index membership (survivorship-biased by construction) -- these are
# excluded from the benchmark universe and only used in a labelled robustness run.
#
# Cost assumptions (per side, bps): representative of liquid institutional
# execution, deliberately conservative for retail-sized trades in futures/FX and
# taker fees for crypto. They are assumptions, not broker quotes; the paper reports
# a 0x/1x/3x cost sensitivity.

