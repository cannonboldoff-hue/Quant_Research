  - id: indian_equities_jma_atr_5m
    market: indian_equities
    timeframe: 5m
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  # --- Lever 1 (v2.1 alpha search, 2026-07-13): same jma_signals, 4h/daily via
  # scripts/resample_timeframes.py (resampled from 5m, the full-48-ticker
  # source). Mirrors the 5m entry above 1:1, same grid. ---
  - id: indian_equities_jma_atr_4h
    market: indian_equities
    timeframe: 4h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

