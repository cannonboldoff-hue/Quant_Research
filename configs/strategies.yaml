# Strategy registry: strategy_id -> signal function + market/timeframe/params.
# Source of truth for what belongs here: docs/STRATEGY_INDEX.md, docs/CODE_MAP.md,
# docs/notebook_mapping.csv. The 73 notebooks collapse into a handful of unique
# signal patterns -- entries below point at one parameterized function per
# pattern (see src/qresearch/signals/), not one function per notebook.
#
# status: unported entries are documented here for tracking but skipped by
# StrategyRegistry until their signal_module/signal_func exist.

strategies:
  # --- JMA fast/slow crossover + ATR stop/target (the corpus's dominant
  # pattern -- ~25 notebooks, consolidated as signals.generators.jma_signals) ---
  # ponytail: jma()/lhp_dsl() are plain-Python loops (not numba-jitted), so
  # they hold the GIL and don't parallelize under joblib's threading backend.
  # On crypto/forex's multi-million-row 1m series a 6-combo param_grid here
  # serializes to minutes per market. Scoped to default_params only for this
  # first full-registry run; upgrade path is numba-jitting jma()/lhp_dsl()'s
  # inner loops (same pattern as engine_numba.py) before re-enabling the grid.
  - id: crypto_jma_atr_1m
    market: crypto
    timeframe: 1m
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}

  # --- Lever 1 (v2 alpha search, 2026-07-13): same jma_signals, 4h/daily via
  # scripts/resample_timeframes.py. The GIL-bottleneck reasoning that scoped
  # crypto_jma_atr_1m to default_params only doesn't apply here -- daily/4h
  # bar counts are ~1000x smaller than 1m, so a grid is cheap; enabled. ---
  - id: crypto_jma_atr_4h
    market: crypto
    timeframe: 4h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: crypto_jma_atr_daily
    market: crypto
    timeframe: daily
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  # ponytail: diagnosed 2026-07-13 -- the 8% win rate wasn't an engine bug,
  # it was the flat cross-asset 7bps fee_bps+slippage_bps overcharging forex
  # ~10x vs its real cost (EURUSD spread ~0.6 pips =~0.5bps). Re-enabled
  # 2026-07-13: campaign trades feed scripts/apply_realistic_forex_costs.py,
  # which recomputes net return from backtest/costs.py's per-pair spread/swap
  # instead of the flat fee -- run that after this campaign, don't trust this
  # strategy's raw campaign-summary mean_ret/win_rate directly.
  - id: forex_jma_atr_1m
    market: forex
    timeframe: 1m
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}

  - id: forex_jma_atr_4h
    market: forex
    timeframe: 4h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: forex_jma_atr_daily
    market: forex
    timeframe: daily
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: commodities_jma_atr_1h
    market: commodities
    timeframe: 1h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: indices_jma_atr_1h
    market: indices
    timeframe: 1h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  # --- Lever 1 (v2 alpha search, 2026-07-13): 1h JMA clears cost gross but not
  # net; testing whether more room per trade (4h/daily, via
  # scripts/resample_timeframes.py) clears it by a wider margin. Mirrors the
  # 1h entries above 1:1, same signal/grid. ---
  - id: commodities_jma_atr_4h
    market: commodities
    timeframe: 4h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: commodities_jma_atr_daily
    market: commodities
    timeframe: daily
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: indices_jma_atr_4h
    market: indices
    timeframe: 4h
    signal_module: generators
    signal_func: jma_signals
    default_params: {fast: 7, slow: 21}
    param_grid: {fast: [5, 7, 9], slow: [21, 28]}

  - id: indices_jma_atr_daily
